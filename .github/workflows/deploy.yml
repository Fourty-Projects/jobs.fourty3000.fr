name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ne garder qu'un déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve base path
        run: |
          set -euo pipefail
          if [ -f "public/CNAME" ]; then
            echo "Domaine personnalisé détecté -> basePath vide"
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Repo projet -> basePath = /${GITHUB_REPOSITORY#*/}"
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: ${{ env.BASE_PATH }}

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Sanity check output
        run: |
          test -f out/index.html || { echo "::error::out/index.html manquant"; exit 1; }
          echo "Fichiers générés : $(find out -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4